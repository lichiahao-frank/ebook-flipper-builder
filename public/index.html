<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電子書生成器</title>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <style>
    :root {
      --bg:      #0f172a;
      --card:    #1e293b;
      --border:  #334155;
      --accent:  #818cf8;
      --accent2: #6366f1;
      --success: #34d399;
      --danger:  #f87171;
      --text:    #f1f5f9;
      --muted:   #94a3b8;
      --radius:  14px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;
      min-height: 100vh;
      padding: 40px 20px 60px;
    }

    /* ── Layout ── */
    .container {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 8px;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #a5b4fc, #818cf8 40%, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    .card-label {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* ── Name input ── */
    #book-name {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #book-name:focus  { border-color: var(--accent); }
    #book-name::placeholder { color: var(--muted); }

    /* ── Drop zone ── */
    #drop-zone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.08);
    }
    #drop-zone .drop-icon {
      font-size: 2.5rem;
      line-height: 1;
    }
    #drop-zone .drop-text {
      color: var(--muted);
      font-size: 0.95rem;
    }
    #pick-btn {
      background: rgba(129, 140, 248, 0.15);
      border: 1px solid rgba(129, 140, 248, 0.4);
      color: var(--accent);
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    #pick-btn:hover { background: rgba(129, 140, 248, 0.25); }

    /* ── Image grid ── */
    .grid-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    #image-count { font-size: 0.85rem; color: var(--muted); }

    #clear-btn {
      background: transparent;
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: var(--danger);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    #clear-btn:hover { background: rgba(248,113,113,0.1); }

    #image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      min-height: 40px;
    }

    .thumb-item {
      position: relative;
      aspect-ratio: 3/4;
      border-radius: 8px;
      background-size: cover;
      background-position: center;
      background-color: #2d3a52;
      cursor: grab;
      overflow: hidden;
      border: 2px solid transparent;
      transition: border-color 0.2s, transform 0.15s;
    }
    .thumb-item:hover    { border-color: var(--accent); }
    .thumb-item.sortable-chosen  { opacity: 0.8; transform: scale(1.04); }
    .thumb-item.sortable-ghost   { opacity: 0.3; }

    /* Page number badge */
    .page-badge {
      position: absolute;
      top: 5px; left: 5px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      letter-spacing: 0.3px;
      pointer-events: none;
    }

    /* Delete button */
    .del-btn {
      position: absolute;
      top: 4px; right: 4px;
      width: 22px; height: 22px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.65);
      color: #fff;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
    }
    .thumb-item:hover .del-btn { opacity: 1; }
    .del-btn:hover { background: rgba(239,68,68,0.85); }

    .grid-hint {
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }

    /* ── Deploy button ── */
    #deploy-btn {
      width: 100%;
      padding: 16px;
      border-radius: var(--radius);
      border: none;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 24px rgba(99, 102, 241, 0.4);
    }
    #deploy-btn:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.5);
    }
    #deploy-btn:active:not(:disabled) { transform: translateY(0); }
    #deploy-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ── Result card ── */
    #result-card { display: none; }
    #result-card.visible { display: block; }

    .result-status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .result-icon { font-size: 1.5rem; }
    .result-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--success);
    }
    .result-sub {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .url-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    #result-url {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--accent);
      font-size: 0.9rem;
      outline: none;
      cursor: text;
    }
    #copy-btn {
      background: rgba(129,140,248,0.15);
      border: 1px solid rgba(129,140,248,0.4);
      color: var(--accent);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    #copy-btn:hover  { background: rgba(129,140,248,0.25); }
    #copy-btn.copied { color: var(--success); border-color: var(--success); }

    .miro-guide {
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 0.85rem;
      line-height: 1.7;
      color: var(--muted);
    }
    .miro-guide strong { color: var(--text); }
    .miro-guide ol { padding-left: 18px; }
    .miro-guide li { margin-top: 4px; }

    .open-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      color: var(--accent);
      font-size: 0.85rem;
      text-decoration: none;
    }
    .open-link:hover { text-decoration: underline; }

    /* ── Overlay ── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    #overlay.visible { display: flex; }

    .big-spinner {
      width: 52px; height: 52px;
      border: 4px solid rgba(255,255,255,0.12);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #overlay-text {
      font-size: 1rem;
      color: var(--muted);
      text-align: center;
      max-width: 300px;
      line-height: 1.6;
    }
    #overlay-text strong { color: var(--text); font-size: 1.05rem; }
    #overlay-stage { font-size: 0.8rem; color: rgba(255,255,255,0.3); margin-top: 4px; }

    /* ── Error ── */
    #error-card { display: none; }
    #error-card.visible { display: block; }
    .error-msg {
      color: var(--danger);
      font-size: 0.9rem;
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.25);
      border-radius: 8px;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>📚 電子書生成器</h1>
    <p>上傳圖片 → 調整順序 → 一鍵部署，取得 Miro Embed 網址</p>
  </header>

  <!-- Step 1: Book name -->
  <div class="card">
    <div class="card-label">書本名稱（用於網址）</div>
    <input id="book-name" type="text" placeholder="例如：my-photobook、2024-annual-report">
  </div>

  <!-- Step 2: Upload -->
  <div class="card">
    <div class="card-label">上傳頁面圖片</div>
    <div id="drop-zone">
      <div class="drop-icon">🖼️</div>
      <div class="drop-text">拖曳圖片到這裡</div>
      <button id="pick-btn">選擇圖片</button>
    </div>
    <input id="file-input" type="file" multiple accept="image/*" hidden>
  </div>

  <!-- Step 3: Reorder -->
  <div class="card" id="grid-card" style="display:none">
    <div class="grid-header">
      <span id="image-count">0 張圖片</span>
      <button id="clear-btn">清除全部</button>
    </div>
    <div id="image-grid"></div>
    <div class="grid-hint">☰ 拖曳縮圖可調整頁面順序</div>
  </div>

  <!-- Deploy button -->
  <button id="deploy-btn" disabled>⚡ 生成並部署電子書</button>

  <!-- Error -->
  <div class="card" id="error-card">
    <div class="card-label" style="color:var(--danger)">部署失敗</div>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <!-- Result -->
  <div class="card" id="result-card">
    <div class="result-status">
      <div class="result-icon">🎉</div>
      <div>
        <div class="result-title">部署成功！</div>
        <div class="result-sub">電子書已上線，可嵌入 Miro</div>
      </div>
    </div>
    <div class="url-row">
      <input id="result-url" readonly>
      <button id="copy-btn">複製</button>
    </div>
    <div class="miro-guide">
      <strong>嵌入 Miro 的步驟：</strong>
      <ol>
        <li>在 Miro 版面點 <strong>+</strong> → <strong>Embed</strong></li>
        <li>貼上上方網址，按 Enter</li>
        <li>電子書卡片出現在版面上，可以翻頁了 🎊</li>
      </ol>
    </div>
    <a id="open-link" href="#" target="_blank" class="open-link">↗ 在新分頁開啟預覽</a>
  </div>
</div>

<!-- Loading overlay -->
<div id="overlay">
  <div class="big-spinner"></div>
  <div id="overlay-text">
    <strong id="overlay-title">正在上傳圖片…</strong><br>
    <span id="overlay-sub">準備檔案中，請稍候</span>
  </div>
  <div id="overlay-stage"></div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────
const fileMap = new Map(); // item element → File object
let sortable;

// ── DOM refs ──────────────────────────────────────────────────
const dropZone   = document.getElementById('drop-zone');
const fileInput  = document.getElementById('file-input');
const grid       = document.getElementById('image-grid');
const gridCard   = document.getElementById('grid-card');
const deployBtn  = document.getElementById('deploy-btn');
const resultCard = document.getElementById('result-card');
const errorCard  = document.getElementById('error-card');
const overlay    = document.getElementById('overlay');

// ── Init SortableJS ─────────────────────────────────────────
sortable = Sortable.create(grid, {
  animation: 150,
  ghostClass: 'sortable-ghost',
  chosenClass: 'sortable-chosen',
  onEnd: updateBadges,
});

// ── Upload triggers ─────────────────────────────────────────
document.getElementById('pick-btn').addEventListener('click', e => {
  e.stopPropagation();
  fileInput.click();
});
dropZone.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', e => {
  addImages([...e.target.files]);
  fileInput.value = '';
});

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('drag-over');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  addImages([...e.dataTransfer.files].filter(f => f.type.startsWith('image/')));
});

// ── Clear all ───────────────────────────────────────────────
document.getElementById('clear-btn').addEventListener('click', () => {
  grid.innerHTML = '';
  fileMap.clear();
  updateState();
});

// ── Copy URL ────────────────────────────────────────────────
document.getElementById('copy-btn').addEventListener('click', () => {
  const url = document.getElementById('result-url').value;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = '✓ 已複製';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '複製'; btn.classList.remove('copied'); }, 2000);
  });
});

// ── Deploy ──────────────────────────────────────────────────
deployBtn.addEventListener('click', deploy);

// ── Core functions ─────────────────────────────────────────

function addImages(files) {
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;

    const item = document.createElement('div');
    item.className = 'thumb-item';

    // Thumbnail preview
    const reader = new FileReader();
    reader.onload = e => item.style.backgroundImage = `url(${e.target.result})`;
    reader.readAsDataURL(file);

    // Page number badge
    const badge = document.createElement('span');
    badge.className = 'page-badge';
    item.appendChild(badge);

    // Delete button
    const del = document.createElement('button');
    del.className = 'del-btn';
    del.innerHTML = '&times;';
    del.addEventListener('click', e => {
      e.stopPropagation();
      fileMap.delete(item);
      item.remove();
      updateBadges();
      updateState();
    });
    item.appendChild(del);

    fileMap.set(item, file);
    grid.appendChild(item);
  }
  updateBadges();
  updateState();
}

function updateBadges() {
  [...grid.querySelectorAll('.thumb-item')].forEach((el, i) => {
    el.querySelector('.page-badge').textContent = i + 1;
  });
}

function updateState() {
  const count = grid.querySelectorAll('.thumb-item').length;
  document.getElementById('image-count').textContent = `${count} 張圖片`;
  gridCard.style.display  = count > 0 ? 'block' : 'none';
  deployBtn.disabled      = count === 0;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

function setOverlay(title, sub, stage = '') {
  document.getElementById('overlay-title').textContent = title;
  document.getElementById('overlay-sub').textContent   = sub;
  document.getElementById('overlay-stage').textContent = stage;
}

async function deploy() {
  const items = [...grid.querySelectorAll('.thumb-item')];
  if (!items.length) return;

  resultCard.classList.remove('visible');
  errorCard.classList.remove('visible');
  overlay.classList.add('visible');
  deployBtn.disabled = true;

  try {
    // Step 1: Upload images and create deployment
    setOverlay('正在上傳圖片…', `共 ${items.length} 張，請稍候`);

    const formData = new FormData();
    formData.append('name', document.getElementById('book-name').value.trim());
    for (const item of items) {
      const file = fileMap.get(item);
      if (file) formData.append('images', file, file.name);
    }

    const deployRes  = await fetch('/api/deploy', { method: 'POST', body: formData });
    const deployData = await deployRes.json();

    if (!deployData.deployId) {
      throw new Error(deployData.error || '部署建立失敗');
    }

    // Step 2: Poll for completion
    setOverlay('部署到 Vercel 中…', '通常需要 30–60 秒，請稍候', `ID: ${deployData.deployId}`);

    let url = null;
    for (let i = 0; i < 60; i++) {
      await sleep(3000);
      const statusRes  = await fetch(`/api/status?id=${deployData.deployId}`);
      const statusData = await statusRes.json();

      if (statusData.readyState === 'READY') {
        url = statusData.url;
        break;
      }
      if (statusData.readyState === 'ERROR') {
        throw new Error('部署失敗：' + (statusData.error || '未知錯誤'));
      }

      const elapsed = ((i + 1) * 3);
      setOverlay('部署到 Vercel 中…', `已等待 ${elapsed} 秒…`, `狀態：${statusData.readyState}`);
    }

    if (!url) throw new Error('部署逾時（超過 3 分鐘）');

    document.getElementById('result-url').value = url;
    document.getElementById('open-link').href   = url;
    resultCard.classList.add('visible');
    resultCard.scrollIntoView({ behavior: 'smooth', block: 'center' });

  } catch (err) {
    document.getElementById('error-msg').textContent = err.message;
    errorCard.classList.add('visible');
  } finally {
    overlay.classList.remove('visible');
    deployBtn.disabled = false;
  }
}
</script>
</body>
</html>
